name: Build Russian resource pack
on:
  push:
    branches: [main]
    paths:
      - 'resourcepacks/NeVanilla-RU/**'
      - '.github/workflows/build-ru-pack.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package resource pack
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          folder = Path('resourcepacks/NeVanilla-RU')
          dest = Path('resourcepacks/NeVanilla-FTB-Essentials-RU.zip')
          with ZipFile(dest, 'w', ZIP_DEFLATED) as z:
              for path in sorted(folder.rglob('*')):
                  if path.is_file():
                      z.write(path, path.relative_to(folder))
          print(f'Built {dest} ({dest.stat().st_size} bytes)')
          PY
      - name: Publish resource pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resourcepacks/NeVanilla-FTB-Essentials-RU.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Build NeVanilla Russian resource pack'
            git push
          fi
